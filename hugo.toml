baseURL = "https://lianas.org/"
title = "Liana Sargent"
locale = "en-us"

copyright = "Writing by Liana Sargent"
enableEmoji = true
enableRobotsTXT = true

[params]
  description = "Personal blog"
  dateFormat = "2006-01-02"
  favicon = "/favicon.png"

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepSpecialComments = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[module]
  [[module.imports]]
    path = "github.com/janraasch/hugo-bearblog"

[[menus.main]]
  name = "RSS"
  url = "/index.xml"
  weight = 99
