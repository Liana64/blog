<style>
  :root {
    color-scheme: dark;
    --width: 800px;
    --font-main: Verdana, sans-serif;
    --font-serif: Georgia, "Noto Serif", serif;
    --font-mono: "JetBrainsMono Nerd Font", ui-monospace, monospace;
    --font-scale: 1em;
    --background-color: #222222;
    --surface-color: #282828;
    --muted-color: #928374;
    --heading-color: #ffffff;
    --text-color: #faf8f1;
    --link-color: #ff7294;
    --blockquote-color: #bdae93;
  }

  body {
    font-family: var(--font-main);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  h1 { font-size: 1.3em; }
  h2 { font-size: 1.15em; }
  h3 { font-size: 1.05em; }
  h4, h5, h6 { font-size: 1em; }

  .title h2 { font-size: 1.5em; }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav a {
    margin-right: 8px;
  }

  strong, b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 0.9em;
    color: var(--muted-color);
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed var(--muted-color);
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: var(--font-mono);
    background-color: var(--surface-color);
    padding: 2px 4px;
    border-radius: 3px;
  }

  blockquote {
    font-family: var(--font-serif);
    color: var(--blockquote-color);
    border-left: 1px solid var(--muted-color);
    margin-inline: 3.5em 0;
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px 0;
    text-align: center;
    color: var(--muted-color);
  }

  .title:hover {
    text-decoration: none;
  }

  .inline {
    width: auto !important;
  }

  .highlight, .code {
    background-color: var(--surface-color);
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    padding: 0.5em;
    overflow-x: auto;
  }

  .highlight pre, .code pre {
    min-width: 100%;
    width: max-content;
    margin: 0;
  }

  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 110px;
  }
</style>
